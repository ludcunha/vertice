# Job vertice_farol: a Torre de Controle inteira, toda segunda às 6h (America/Sao_Paulo).
# No target dev o agendamento fica pausado pelo preset trigger_pause_status.
#
#   ingestao_feriados ──┐
#                       ├── conferencia_bronze ── medalhao ──┬── testes_de_qualidade
#   ingestao_data_lake ─┘                                    └── status_com_ia
#
# As 6 tarefas:
#   1. ingestao_feriados    notebook: BrasilAPI → bronze.feriados
#   2. ingestao_data_lake   notebook: Supabase Storage (boto3, S3) → volume bronze.raw → 9 tabelas bronze
#   3. conferencia_bronze   sql_task: contagem das 9 tabelas bronze contra o esperado, falha se divergir
#   4. medalhao             pipeline Lakeflow vertice_medalhao: silver ×7 → gold ×3
#   5. testes_de_qualidade  sql_task: testes entre tabelas (bronze × silver × gold), raise_error se quebrar
#   6. status_com_ia        sql_task: o texto do status vira coluna em gold.status_estruturado
#                           (regra, palavra-chave e ai_classify + ai_extract nos últimos 90 dias), MERGE incremental
#
# max_concurrent_runs: 1 porque duas execuções ao mesmo tempo apagariam a bronze uma da outra.
resources:
  jobs:
    vertice_farol:
      name: vertice_farol
      tasks:
        # BrasilAPI → bronze.feriados
        - task_key: ingestao_feriados
          disabled: false
          email_notifications: {}
          environment_key: Default
          notebook_task:
            notebook_path: ../src/ingestao/Farol_01_ingestao_api.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}

        # Supabase Storage (boto3, protocolo S3) → volume bronze.raw → as 9 tabelas bronze
        - task_key: ingestao_data_lake
          disabled: false
          email_notifications: {}
          notebook_task:
            base_parameters:
              AWS_ACCESS_KEY_ID: ${var.s3_access_key_id}
              AWS_DEFAULT_REGION: us-east-1
              AWS_SECRET_ACCESS_KEY: ${var.s3_secret_access_key}
              S3_ENDPOINT: https://elgbwtelwlxjidjbxsrm.storage.supabase.co/storage/v1/s3
            notebook_path: ../src/ingestao/Farol_02_ingestao_boto3.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}

        # Contagem das 9 tabelas bronze contra o esperado (seed 42); falha se alguma divergir.
        - task_key: conferencia_bronze
          depends_on:
            - task_key: ingestao_feriados
            - task_key: ingestao_data_lake
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/conferencia/00-conferencia-bronze.sql

        # Pipeline Lakeflow: silver ×7 → gold ×3
        - task_key: medalhao
          depends_on:
            - task_key: conferencia_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.vertice_medalhao.id}

        # Os 10 testes entre tabelas (bronze × silver × gold); raise_error no primeiro que falhar.
        - task_key: testes_de_qualidade
          depends_on:
            - task_key: medalhao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/testes/testes.sql

        # Texto livre do status → gold.status_estruturado. Em paralelo com os testes:
        # depende só da silver.status_semanal, que o medalhão acabou de atualizar.
        - task_key: status_com_ia
          depends_on:
            - task_key: medalhao
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/ia/status_estruturado.sql

      email_notifications:
        no_alert_for_skipped_runs: false
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: America/Sao_Paulo
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
